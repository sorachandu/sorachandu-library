
name: verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification-helper
        run: |
          python -m pip install "setuptools<81"
          python -m pip install online-judge-verify-helper

      - name: Run verification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: oj-verify run

      - name: Generate documentation
        if: github.event_name != 'pull_request'
        run: oj-verify docs

      - name: Set up Ruby
        if: github.event_name != 'pull_request'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Jekyll
        if: github.event_name != 'pull_request'
        run: gem install github-pages --no-document

      - name: Build documentation site
        if: github.event_name != 'pull_request'
        run: |
          jekyll build \
            --source .verify-helper/markdown \
            --destination "$GITHUB_WORKSPACE/_site" \
            --baseurl "/${{ github.event.repository.name }}"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
